<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数析 · 面试练习</title><meta name="description" content="从真实面经中整理数据分析与数据科学练习题，按六类内容与公司筛选，查看简短参考答案并回溯原图。"><meta name="theme-color" content="#f6f8fb"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M8 8h7v16H8zm10 0h6v16h-6z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script src="practice-core.js" defer></script><script src="app.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="数析面试练习首页"><span class="brand-symbol">析</span>数析<span class="brand-light">面试练习</span></a><nav class="view-switch" aria-label="浏览方式"><button data-view="questions" class="active" aria-pressed="true">题目练习</button><button data-view="notes" aria-pressed="false">面经资料</button></nav><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" placeholder="搜索题目、考点、公司" aria-label="搜索题目、考点、公司"></label></header>
<main class="explore"><div class="explore-toolbar"><nav id="categories" aria-label="内容分类"></nav><div class="filters"><select id="company" aria-label="公司"><option value="">全部公司</option></select><select id="year" aria-label="年份"><option value="">全部年份</option><option value="2026">2026 年</option><option value="2025">2025 年</option></select><select id="sort" aria-label="排序"><option value="sources">收录篇数</option><option value="newest">最新发布</option><option value="oldest">最早发布</option></select></div></div>
<div class="results-line"><span id="result-count" aria-live="polite">正在加载题目…</span><button class="text-button" id="reset" hidden>清除筛选</button></div>
<section id="practice" class="practice-workspace" aria-label="题目练习区"><aside class="question-sidebar" aria-label="题目列表"><div id="question-list"></div><div id="pagination" class="pagination"></div></aside><section id="answer-reader" class="answer-reader" aria-label="题目与参考答案"></section></section><section class="note-grid" id="note-list" aria-label="面经列表" hidden></section>
</main>
<dialog id="detail" aria-label="面经详情"><button class="close-detail" id="close-detail" aria-label="关闭面经">✕</button><article class="note-detail"><section class="visual-panel" id="visual-panel" aria-label="面经原图"></section><section class="content-panel" id="content-panel" aria-label="原帖内容"></section></article></dialog>
<dialog id="zoom" aria-label="放大原图"><div class="zoom-toolbar"><span id="zoom-caption"></span><div><button id="zoom-prev" class="zoom-control" aria-label="上一张原图">←</button><button id="zoom-next" class="zoom-control" aria-label="下一张原图">→</button><button id="zoom-close" class="zoom-control" aria-label="关闭原图">✕</button></div></div><div class="zoom-scroll"><img id="zoom-image" alt=""></div></dialog>
</body></html>
